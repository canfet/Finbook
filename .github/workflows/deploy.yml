name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 執行自動測試（失敗就不部署）
        run: node --test tests/logic.test.js

      - name: 產生 config.js（後端網址來自 Repository variable）
        env:
          # 在 repo Settings → Secrets and variables → Actions → Variables 設定
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: node .github/scripts/make-config.js

      - name: 移除不需要放上網站的檔案
        run: rm -rf .github tests apps-script node_modules package.json package-lock.json playwright.config.js config.example.js

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 打包網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
